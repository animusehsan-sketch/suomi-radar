<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suomi Radar - Live Finland Flights Tracker</title>
    <meta name="description" content="Live real-time flight tracking over Finland. Visualize air traffic with high-precision ADS-B data, interactive maps, and glassmorphic design.">
    <meta name="keywords" content="flight tracker, Finland radar, live flights, aviation, ADS-B, Leaflet map, Suomi Radar">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="Suomi Radar - Live Finland Flights Tracker">
    <meta property="og:description" content="Real-time air traffic visualization over Finland using live ADS-B data.">
    <meta property="og:type" content="website">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Toggle for Mobile -->
        <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle Sidebar">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>

        <aside class="glass-panel sidebar" id="sidebar">
            <header>
                <div class="logo-area">
                    <div class="radar-pulse"></div>
                    <h1>Suomi Radar</h1>
                </div>
                <p class="tagline">Live Northern Airspace</p>
            </header>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-label">Active Flights</span>
                    <div class="stat-value-container">
                        <span class="stat-value" id="flight-count">0</span>
                        <div class="live-indicator"></div>
                    </div>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Last Ping</span>
                    <span class="stat-value mono" id="last-updated">--:--:--</span>
                </div>
            </div>

            <div class="search-box">
                <input type="text" id="flight-search" placeholder="Search callsign or reg...">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>

            <div class="flight-list-header">
                <h3>Live Traffic</h3>
                <span class="badge" id="visible-count">0 visible</span>
            </div>

            <div class="flight-list-container">
                <ul class="flight-list" id="flight-list">
                    <li class="flight-placeholder">
                        <div class="spinner"></div>
                        <span>Initializing Radar...</span>
                    </li>
                </ul>
            </div>
            
            <footer class="sidebar-footer">
                <div class="data-source">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg>
                    <span>Real-time ADS-B via Airplanes.live</span>
                </div>
            </footer>
        </aside>

        <main class="map-wrapper">
            <div id="map" class="map-container"></div>
            
            <!-- Map Overlay Controls -->
            <div class="map-controls">
                <button class="control-btn" id="recenter-btn" title="Recenter on Finland">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
            </div>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="app.js"></script>
</body>
</html>
